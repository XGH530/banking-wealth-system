<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>银行记账与理财系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>

<!-- ===== 侧边栏 + 顶栏 + 主内容 ===== -->
<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="bi bi-bank2"></i></div>
      <div class="brand-text">
        <div class="brand-title">银行记账</div>
        <div class="brand-sub">Bank & Finance</div>
      </div>
    </div>
    <nav class="nav" id="navMenu">
      <a class="nav-item active" data-route="dashboard"><i class="bi bi-speedometer2"></i><span>仪表盘</span></a>
      <a class="nav-item" data-route="accounts"><i class="bi bi-wallet2"></i><span>我的账户</span></a>
      <a class="nav-item" data-route="transactions"><i class="bi bi-arrow-left-right"></i><span>交易流水</span></a>
      <a class="nav-item" data-route="deposit"><i class="bi bi-cash-coin"></i><span>存款</span></a>
      <a class="nav-item" data-route="withdraw"><i class="bi bi-cash-stack"></i><span>取款</span></a>
      <a class="nav-item" data-route="transfer"><i class="bi bi-send-fill"></i><span>转账</span></a>
      <div class="nav-divider">理财</div>
      <a class="nav-item" data-route="products"><i class="bi bi-box-seam"></i><span>理财产品</span></a>
      <a class="nav-item" data-route="holdings"><i class="bi bi-graph-up-arrow"></i><span>我的持仓</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="user-name" id="userName">--</div>
          <div class="user-role">个人客户</div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()" title="退出登录"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb">仪表盘</div>
      <div class="topbar-right">
        <span class="date" id="topDate"></span>
      </div>
    </header>

    <!-- 页面内容 -->
    <section class="content" id="pageContent">
      <!-- 动态注入 -->
    </section>
  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index:9999"></div>

<!-- Modal 容器 -->
<div class="modal fade" id="appModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="appModalContent"></div>
  </div>
</div>

<!-- Bootstrap JS + Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- 业务 JS -->
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/pages.js"></script>
<script>
  // script 在 body 底部,执行时 DOM 已 ready,直接调 init
  App.init();
</script>
</body>
</html>
