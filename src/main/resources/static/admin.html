<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台管理控制台 · 银行记账与理财系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

<!-- ==================== 登录层 ==================== -->
<div class="admin-login" id="loginLayer">
  <div class="admin-login-card">
    <div class="logo"><i class="bi bi-shield-lock-fill"></i></div>
    <h1>后台管理控制台</h1>
    <div class="sub">银行记账与理财系统 · 管理员登录</div>

    <div class="mb-3">
      <label class="form-label" style="font-size:13px;font-weight:600;color:#4a5568">管理员账号</label>
      <input type="text" class="form-control inp w-100" id="loginUser" placeholder="请输入管理员账号" autocomplete="username">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:13px;font-weight:600;color:#4a5568">密码</label>
      <input type="password" class="form-control inp w-100" id="loginPwd" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary w-100 justify-content-center" id="loginBtn" onclick="Admin.login()">
      <i class="bi bi-box-arrow-in-right"></i> 登 录
    </button>
    <div class="hint" id="loginHint">
      演示管理员：<b>admin / 123456</b><br>
      普通客户账号登录会被拒绝（接口级 RBAC）
    </div>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div class="layout" id="appLayer" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="bi bi-shield-lock-fill"></i></div>
      <div class="brand-text">
        <div class="brand-title">管理控制台</div>
        <div class="brand-sub">Bank Admin Console</div>
      </div>
    </div>
    <nav class="nav" id="navMenu">
      <div class="nav-divider">数据总览</div>
      <a class="nav-item active" data-tab="dashboard"><i class="bi bi-speedometer2"></i><span>运营概览</span></a>
      <div class="nav-divider">客户与账户</div>
      <a class="nav-item" data-tab="users"><i class="bi bi-people"></i><span>用户管理</span></a>
      <a class="nav-item" data-tab="accounts"><i class="bi bi-wallet2"></i><span>账户管理</span></a>
      <div class="nav-divider">业务数据</div>
      <a class="nav-item" data-tab="txns"><i class="bi bi-arrow-left-right"></i><span>交易流水</span></a>
      <a class="nav-item" data-tab="products"><i class="bi bi-graph-up-arrow"></i><span>理财产品</span></a>
      <a class="nav-item" data-tab="holdings"><i class="bi bi-briefcase"></i><span>理财持仓</span></a>
      <a class="nav-item" data-tab="ledger"><i class="bi bi-journal-text"></i><span>账务对账</span></a>
      <div class="nav-divider">系统</div>
      <a class="nav-item" data-tab="ops"><i class="bi bi-activity"></i><span>运行监控</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="adminAvatar">A</div>
        <div class="user-info">
          <div class="user-name" id="adminName">--</div>
          <div class="user-role">系统管理员</div>
        </div>
        <button class="btn-logout" onclick="Admin.logout()" title="退出登录"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb">运营概览</div>
      <div class="topbar-right d-flex align-items-center gap-3">
        <span class="admin-badge"><i class="bi bi-shield-check"></i> ADMIN</span>
        <span class="date" id="topDate"></span>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/assets/js/admin.js"></script>
<script>Admin.init();</script>
</body>
</html>
